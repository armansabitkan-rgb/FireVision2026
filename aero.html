<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FireVision Aero - Drone Control</title>

  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0c10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FireVision">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <style>
    /* CSS Variables for Premium Dark Mode */
    :root {
      --bg: #0b0c10;
      --glass: rgba(17, 18, 23, 0.6);
      --border: rgba(102, 252, 241, 0.15);
      --text: #eaeaea;
      --muted: rgba(255, 255, 255, 0.5);
      --accent: #66fcf1;
      --danger: #ff3333;
      --warning: #ff9900;
      --success: #4ade80;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Top Bar */
    .top-bar {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text);
      background: var(--glass);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 600;
      backdrop-filter: blur(10px);
      transition: 0.3s;
    }

    .back-btn:hover {
      background: rgba(102, 252, 241, 0.1);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Layout */
    .container {
      display: grid;
      grid-template-columns: 70fr 30fr;
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    @media (max-width: 992px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    /* Glass Panels */
    .panel {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      backdrop-filter: blur(12px);
    }

    h2 {
      margin: 0 0 15px 0;
      font-size: 18px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--accent);
    }

    /* Video Section */
    .video-wrapper {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 16/9;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Overlays */
    .scanner-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: var(--accent);
      box-shadow: 0 0 20px var(--accent), 0 0 40px var(--accent);
      display: none;
      z-index: 10;
    }

    .fire-overlay {
      position: absolute;
      inset: 0;
      border: 4px solid var(--danger);
      box-shadow: inset 0 0 50px rgba(255, 51, 51, 0.5);
      display: none;
      z-index: 5;
      pointer-events: none;
    }

    .fire-text {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 51, 51, 0.9);
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 800;
      letter-spacing: 1px;
      animation: blink 1s infinite alternate;
    }

    @keyframes blink {
      from {
        opacity: 1;
      }

      to {
        opacity: 0.5;
      }
    }

    /* Flight Controls */
    .flight-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.4);
      padding: 15px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      gap: 15px;
    }

    .waypoint-info {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    /* Buttons */
    .btn {
      padding: 14px 20px;
      border-radius: 10px;
      border: none;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }

    .btn:disabled {
      opacity: 0.5;
      filter: grayscale(1);
      cursor: not-allowed;
    }

    .btn-flight {
      background: linear-gradient(135deg, var(--accent) 0%, #3498db 100%);
      color: #000;
      flex: 1;
    }

    .btn-flight:hover:not(:disabled) {
      box-shadow: 0 0 20px rgba(102, 252, 241, 0.4);
      transform: translateY(-2px);
    }

    .btn-ai {
      background: linear-gradient(135deg, #1f222e 0%, #15161d 100%);
      color: var(--accent);
      border: 1px solid var(--accent);
      margin-bottom: 20px;
    }

    .btn-ai:hover:not(:disabled) {
      background: rgba(102, 252, 241, 0.1);
      box-shadow: 0 0 15px rgba(102, 252, 241, 0.2);
    }

    .btn-siren {
      background: var(--warning);
      color: #000;
      margin-bottom: 15px;
    }

    .btn-siren:hover {
      box-shadow: 0 0 20px rgba(255, 153, 0, 0.4);
    }

    .btn-report {
      background: var(--danger);
      color: #fff;
    }

    .btn-report:hover:not(:disabled) {
      box-shadow: 0 0 20px rgba(255, 51, 51, 0.4);
    }

    .btn-report.success {
      background: var(--success);
      color: #000;
      box-shadow: 0 0 20px rgba(74, 222, 128, 0.4);
    }

    /* Telemetry */
    .telemetry-grid {
      display: grid;
      gap: 10px;
      margin-bottom: 25px;
    }

    .telemetry-card {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 12px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .t-label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .t-value {
      font-family: monospace;
      font-size: 15px;
      font-weight: bold;
      color: var(--muted);
    }

    .t-value.standby {
      color: var(--muted);
    }

    .t-value.active-accent {
      color: var(--accent);
      text-shadow: 0 0 10px rgba(102, 252, 241, 0.4);
    }

    .t-value.active-danger {
      color: var(--danger);
      text-shadow: 0 0 10px rgba(255, 51, 51, 0.4);
    }

    .t-value.active-warning {
      color: var(--warning);
      text-shadow: 0 0 10px rgba(255, 153, 0, 0.4);
    }

    .t-value.active-normal {
      color: #fff;
    }
  </style>
</head>

<body>

  <div class="top-bar">
    <a href="dashboard.html" class="back-btn">← Назад к Спутнику</a>
  </div>

  <div class="container">
    <!-- Левая Колонка: Видео и Управление полетом -->
    <div class="left-col">
      <div class="panel">
        <div class="video-wrapper">
          <video id="droneVideo" autoplay loop muted playsinline src="assets/drone1.mp4"></video>
          <div class="scanner-line" id="scannerLine"></div>
          <div class="fire-overlay" id="fireOverlay">
            <div class="fire-text">⚠️ POTENTIAL THREAT: 74%</div>
          </div>
        </div>

        <div class="flight-controls">
          <button class="btn btn-flight" id="btnBack" disabled>⬅️ НАЗАД</button>
          <div class="waypoint-info">
            📍 Точка: <span id="waypointCounter">1</span> / 5
          </div>
          <button class="btn btn-flight" id="btnFly">Вперед ➡️</button>
        </div>
      </div>
    </div>

    <!-- Правая Колонка: Телеметрия и Экшены -->
    <div class="right-col">
      <div class="panel" style="margin-bottom: 20px;">
        <h2>ИИ-Телеметрия</h2>
        <button class="btn btn-ai" id="btnAi" disabled>🔍 ЗАПУСТИТЬ ИИ-АНАЛИЗ</button>

        <div class="telemetry-grid">
          <div class="telemetry-card">
            <span class="t-label">Уверенность ИИ</span>
            <span class="t-value standby" id="valConf">STANDBY</span>
          </div>
          <div class="telemetry-card">
            <span class="t-label">Критичность</span>
            <span class="t-value standby" id="valCrit">STANDBY</span>
          </div>
          <div class="telemetry-card">
            <span class="t-label">Высота</span>
            <span class="t-value standby" id="valAlt">STANDBY</span>
          </div>
          <div class="telemetry-card">
            <span class="t-label">Площадь очага</span>
            <span class="t-value standby" id="valArea">STANDBY</span>
          </div>
          <div class="telemetry-card">
            <span class="t-label">Батарея</span>
            <span class="t-value active-normal">84%</span>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2>Действия</h2>
        <button class="btn btn-siren" id="btnSiren">🔊 ВКЛЮЧИТЬ СИРЕНУ</button>
        <button class="btn btn-report" id="btnReport" disabled>🚨 ПЕРЕДАТЬ ОТЧЕТ В МЧС</button>
      </div>
    </div>
  </div>

  <script>
    // Elements
    const droneVideo = document.getElementById('droneVideo');
    const btnFly = document.getElementById('btnFly');
    const btnBack = document.getElementById('btnBack');
    const waypointCounter = document.getElementById('waypointCounter');

    const btnAi = document.getElementById('btnAi');
    const scannerLine = document.getElementById('scannerLine');
    const fireOverlay = document.getElementById('fireOverlay');

    const valConf = document.getElementById('valConf');
    const valCrit = document.getElementById('valCrit');
    const valAlt = document.getElementById('valAlt');
    const valArea = document.getElementById('valArea');

    const btnSiren = document.getElementById('btnSiren');
    const btnReport = document.getElementById('btnReport');

    // Video Array
    const videos = [
      "assets/drone1.mp4", "assets/drone2.mp4", "assets/drone3.mp4",
      "assets/drone4.mp4", "assets/drone5.mp4"
    ];
    let currentWaypoint = 1;

    // --- ЛОГИКА 1: Полет Дрона ---
    function updateFlightUI() {
      waypointCounter.textContent = currentWaypoint;
      droneVideo.src = videos[currentWaypoint - 1];
      droneVideo.play().catch(e => console.log('Autoplay prevented:', e));

      // Кнопка назад
      btnBack.disabled = (currentWaypoint === 1);

      // Кнопка вперед
      btnFly.disabled = (currentWaypoint === 5);
      btnFly.textContent = currentWaypoint === 5 ? "ДОСТИГНУТА" : "Вперед ➡️";

      // Сброс и блокировка ИИ если мы не на последней точке
      if (currentWaypoint === 5) {
        btnAi.disabled = false;
      } else {
        btnAi.disabled = true;
        btnAi.textContent = "🔍 ЗАПУСТИТЬ ИИ-АНАЛИЗ";
        scannerLine.style.display = 'none';
        fireOverlay.style.display = 'none';

        // Сброс данных на STANDBY
        [valConf, valCrit, valAlt, valArea].forEach(el => {
          el.textContent = "STANDBY";
          el.className = "t-value standby";
        });
        btnReport.disabled = true;
        btnReport.classList.remove('success');
        btnReport.textContent = "🚨 ПЕРЕДАТЬ ОТЧЕТ В МЧС";
      }
    }

    btnFly.addEventListener('click', () => {
      if (currentWaypoint < 5) {
        currentWaypoint++;
        updateFlightUI();
      }
    });

    btnBack.addEventListener('click', () => {
      if (currentWaypoint > 1) {
        currentWaypoint--;
        updateFlightUI();
      }
    });

    // --- ЛОГИКА 2: ИИ-Анализ ---
    btnAi.addEventListener('click', () => {
      btnAi.disabled = true;
      btnAi.textContent = "Анализирую...";

      // Анимация сканера
      scannerLine.style.display = 'block';
      let scanPos = 0;
      let scanDir = 1;
      const scanInterval = setInterval(() => {
        scanPos += 2 * scanDir;
        if (scanPos > 98 || scanPos < 0) scanDir *= -1;
        scannerLine.style.top = scanPos + '%';
      }, 16);

      // Завершение анализа через 2.5 секунды
      setTimeout(() => {
        clearInterval(scanInterval);
        scannerLine.style.display = 'none';
        btnAi.textContent = "АНАЛИЗ ЗАВЕРШЕН";

        // Показ оверлея огня
        fireOverlay.style.display = 'block';

        // Обновление телеметрии под реализм (потенциальная угроза)
        valConf.textContent = "74%";
        valConf.className = "t-value active-accent";

        valCrit.textContent = "WARNING";
        valCrit.className = "t-value active-warning"; // Оранжевый

        valAlt.textContent = "20м";
        valAlt.className = "t-value active-normal";

        valArea.textContent = "Unconfirmed";
        valArea.className = "t-value active-normal";

        // Разблокировка кнопки передачи отчета
        btnReport.disabled = false;
      }, 2500);
    });

    // --- ЛОГИКА 3: Экшен-кнопки ---
    btnSiren.addEventListener('click', () => {
      alert('Сирена включена!');
    });

    btnReport.addEventListener('click', async () => {
      btnReport.disabled = true;
      btnReport.textContent = "Отправка...";

      const botToken = "8674807819:AAEhEVzKbNhOKogwEbjre7SptzGfl8stPNk";
      const chatId = "@firevision_alerts";

      const message = `🚨 *FIREVISION ALERT: DRONE INCIDENT REPORT* 🚨

📍 *Location:* Waypoint 5
🤖 *AI Confidence:* 74%
⚠️ *Severity Level:* POTENTIAL THREAT
🚁 *Flight Altitude:* 20m
🔥 *Est. Fire Area:* Unconfirmed
🔋 *Drone Battery:* 84%

_Small heat source detected. Not categorized as active wildfire. Potential hazard. Ground verification recommended._`;

      const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: chatId,
            text: message,
            parse_mode: 'Markdown'
          })
        });

        if (response.ok) {
          btnReport.classList.add('success');
          btnReport.textContent = "ОТЧЕТ ПЕРЕДАН";
        } else {
          throw new Error('API Error');
        }
      } catch (error) {
        console.error('Telegram API Error:', error);
        btnReport.disabled = false;
        btnReport.textContent = "ОШИБКА. ПОВТОРИТЬ?";
        alert('Не удалось отправить отчет в Telegram. Проверьте подключение.');
      }
    });

    // PWA: Service Worker Registration
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(r => console.log('[PWA] SW registered'))
        .catch(e => console.warn('[PWA] SW failed:', e));
    }
  </script>
</body>

</html>
